<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiTab GPT</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="p-4 font-sans min-w-[400px] max-w-[500px] bg-gradient-to-b from-blue-900 to-slate-900 text-white">

  <h1 class="text-2xl font-bold mb-4 text-center">MultiTab GPT</h1>

  <!-- Label before Tab List -->
  <p class="text-sm mb-2 font-semibold text-gray-300">
    Select Tabs to Summarize:
  </p>

  <!-- Tabs List -->
  <div id="tabsList" class="bg-gray-800 p-3 rounded-lg max-h-40 overflow-y-auto mb-4 border border-gray-600"></div>

  <!-- Summarize Button -->
  <button id="summarizeTabs" class="w-full bg-green-600 text-white py-2 rounded-lg mb-4 hover:bg-green-700 text-lg">
    Summarize Selected Tabs
  </button>

  <!-- Output -->
  <div id="output" class="p-2 rounded-lg text-sm max-h-60 overflow-y-auto mb-4 hidden"></div>

  <!-- Export Buttons -->
  <div id="exportSection" class="flex gap-2 justify-between hidden">
    <button id="copyBtn" class="flex-1 bg-gray-700 text-white py-2 rounded-lg hover:bg-gray-800">Copy</button>
    <button id="txtBtn" class="flex-1 bg-gray-700 text-white py-2 rounded-lg hover:bg-gray-800">Download TXT</button>
  </div>

  <p id="status" class="text-center text-sm text-gray-300 mt-3"></p>

  <script src="libs/FileSaver.min.js"></script>
  <script src="utils.js"></script>
  <script src="popup.js"></script>

</html>
